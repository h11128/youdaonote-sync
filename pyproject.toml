[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youdaonote-sync"
version = "3.0.0"
description = "有道云笔记同步工具 - 支持双向同步、搜索、GUI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DeppWang", email = ""},
]
keywords = ["youdao", "note", "sync", "export", "markdown", "云笔记"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.20.0",
    "markdownify>=0.5.0",
    "Brotli>=1.0.0",
]

[project.optional-dependencies]
# Windows 文件时间设置
windows = ["win32-setctime>=1.0.0"]
# 自动登录
login = ["playwright>=1.40.0"]
# 从浏览器提取 cookies
browser = ["browser-cookie3>=0.19.0"]
# 文件监听（watch 模式）
watch = ["watchdog>=3.0.0"]
# 完整安装（推荐）
full = [
    "win32-setctime>=1.0.0; sys_platform == 'win32'",
    "playwright>=1.40.0",
    "browser-cookie3>=0.19.0",
    "watchdog>=3.0.0",
]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pre-commit>=2.0.0",
]

[project.scripts]
youdaonote-sync = "src.__main__:main"
youdaonote = "src.__main__:main"

[project.urls]
Homepage = "https://github.com/DeppWang/youdaonote-sync"
Repository = "https://github.com/DeppWang/youdaonote-sync"
Issues = "https://github.com/DeppWang/youdaonote-sync/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
