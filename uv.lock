[[package]]
name = "youdaonote-sync"
version = "3.0.0"
source = { editable = "." }
dependencies = [
    { name = "brotli" },
    { name = "httpx" },
    { name = "markdownify" },
    { name = "xxhash" },
]

[package.optional-dependencies]
browser = [
    { name = "browser-cookie3" },
]
dev = [
    { name = "pre-commit", version = "3.5.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.9'" },
    { name = "pre-commit", version = "4.3.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version == '3.9.*'" },
    { name = "pre-commit", version = "4.5.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.10'" },
    { name = "pytest", version = "8.3.5", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.9'" },
    { name = "pytest", version = "8.4.2", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version == '3.9.*'" },
    { name = "pytest", version = "9.0.2", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.10'" },
]
full = [
    { name = "browser-cookie3" },
    { name = "playwright", version = "1.48.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.9'" },
    { name = "playwright", version = "1.58.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.9'" },
    { name = "watchdog", version = "4.0.2", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.9'" },
    { name = "watchdog", version = "6.0.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.9'" },
    { name = "win32-setctime", marker = "sys_platform == 'win32'" },
]
login = [
    { name = "playwright", version = "1.48.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.9'" },
    { name = "playwright", version = "1.58.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.9'" },
]
watch = [
    { name = "watchdog", version = "4.0.2", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.9'" },
    { name = "watchdog", version = "6.0.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.9'" },
]
windows = [
    { name = "win32-setctime" },
]

[package.metadata]
requires-dist = [
    { name = "brotli", specifier = ">=1.0.0" },
    { name = "browser-cookie3", marker = "extra == 'browser'", specifier = ">=0.19.0" },
    { name = "browser-cookie3", marker = "extra == 'full'", specifier = ">=0.19.0" },
    { name = "httpx", specifier = ">=0.27.0" },
    { name = "markdownify", specifier = ">=0.5.0" },
    { name = "playwright", marker = "extra == 'full'", specifier = ">=1.40.0" },
    { name = "playwright", marker = "extra == 'login'", specifier = ">=1.40.0" },
    { name = "pre-commit", marker = "extra == 'dev'", specifier = ">=2.0.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=7.0.0" },
    { name = "watchdog", marker = "extra == 'full'", specifier = ">=3.0.0" },
    { name = "watchdog", marker = "extra == 'watch'", specifier = ">=3.0.0" },
    { name = "win32-setctime", marker = "sys_platform == 'win32' and extra == 'full'", specifier = ">=1.0.0" },
    { name = "win32-setctime", marker = "extra == 'windows'", specifier = ">=1.0.0" },
    { name = "xxhash", specifier = ">=3.0.0" },
]
provides-extras = ["windows", "login", "browser", "watch", "full", "dev"]
